stages:
    # - deploy_static
    - deploy_dev

default:
    image: alpine:3.15.0
    cache:
        key:
            files:
                - frontend/yarn.lock
        paths:
            - frontend/node_modules/

.install_deps:
    before_script:
        # install git to get dependencies from github
        - apk --update add git
        - cd frontend
        - yarn install

.setup_ssh:
    before_script:
        - apk add --update openssh rsync
        - eval $(ssh-agent -s)
        - echo "$SSH_DEV_PRIVATE_KEY" | tr -d '\r' | ssh-add -
        - mkdir -p ~/.ssh
        - chmod 700 ~/.ssh
        - ssh-keyscan -H $SSH_DEV_HOST >> ~/.ssh/known_hosts

