deploy_dev:
    extends:
        - .setup_ssh
    stage: deploy_dev
    when: manual
    script:
        - ssh $SSH_DEV_USER@$SSH_DEV_HOST "cd $SSH_DEV_PATH && git pull origin master && make migrations-dev"
